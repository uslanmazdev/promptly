<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seni Seviyorum</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #8B0000 0%, #DC143C 50%, #FF1493 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Georgia', serif;
            overflow: hidden;
            position: relative;
            padding: 20px;
        }

        .container {
            text-align: center;
            z-index: 10;
            max-width: 900px;
            width: 100%;
            padding: 20px;
            background: rgba(139, 0, 0, 0.2);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(255, 20, 147, 0.3);
        }

        h1 {
            color: #fff;
            font-size: clamp(2rem, 5vw, 4rem);
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0,0,0,0.5);
            animation: fadeIn 2s ease-in;
            letter-spacing: 2px;
        }

        .message {
            color: #FFE4E1;
            font-size: clamp(1.2rem, 3vw, 1.8rem);
            margin-bottom: 30px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.4);
            animation: fadeIn 3s ease-in;
            line-height: 1.6;
        }

        .heart {
            position: absolute;
            background: #ff0844;
            transform: rotate(-45deg);
            animation: float 6s infinite ease-in-out;
            opacity: 0.7;
        }

        .heart:before,
        .heart:after {
            content: "";
            position: absolute;
            background: #ff0844;
            border-radius: 50%;
        }

        .heart:before {
            top: -50%;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .heart:after {
            left: 50%;
            top: 0;
            width: 100%;
            height: 100%;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(-45deg);
                opacity: 0.6;
            }
            50% {
                transform: translateY(-30px) rotate(-45deg);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .center-heart {
            width: clamp(120px, 30vw, 200px);
            height: clamp(120px, 30vw, 200px);
            margin: 40px auto;
            position: relative;
            animation: pulse 1.5s infinite;
        }

        .center-heart .heart {
            position: relative;
            width: 100%;
            height: 100%;
            margin: 0 auto;
            background: #FF1493;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.8);
        }

        .center-heart .heart:before,
        .center-heart .heart:after {
            background: #FF1493;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.15);
            }
        }

        .love-quote {
            color: #FFE4E1;
            font-style: italic;
            font-size: clamp(1rem, 2.5vw, 1.4rem);
            margin-top: 30px;
            animation: fadeIn 4s ease-in;
            padding: 0 20px;
        }

        .romantic-text {
            color: #FFC0CB;
            font-size: clamp(0.9rem, 2vw, 1.1rem);
            margin-top: 20px;
            animation: fadeIn 5s ease-in;
            max-width: 600px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.8;
        }

        .rose {
            font-size: clamp(2rem, 5vw, 3rem);
            margin: 20px 0;
            animation: fadeIn 3.5s ease-in;
        }

        @media (max-width: 768px) {
            .container {
                padding: 30px 20px;
                border-radius: 20px;
            }

            h1 {
                margin-bottom: 15px;
            }

            .message {
                margin-bottom: 20px;
            }

            .center-heart {
                margin: 30px auto;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .container {
                padding: 20px 15px;
            }

            .love-quote, .romantic-text {
                padding: 0 10px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Karımı Çok Seviyorum</h1>
        <p class="message">Sen benim hayatımın anlamı, ruhumun eş parçasısın</p>
        
        <div class="center-heart">
            <div class="heart"></div>
        </div>
        
        <div class="rose">🌹</div>
        
        <p class="love-quote">"Seninle her an bir mucize, her gün bir harika"</p>
        
        <p class="romantic-text">
            Gözlerinde kaybolmak, ellerini tutmak, seninle olmak... 
            İşte benim için cennetin tanımı budur. 
            Seni seviyorum, bugün, yarın ve sonsuza kadar.
        </p>
    </div>

    <script>
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart';
            const size = Math.random() * 30 + 20;
            heart.style.width = size + 'px';
            heart.style.height = size + 'px';
            heart.style.left = Math.random() * 100 + '%';
            heart.style.top = Math.random() * 100 + '%';
            heart.style.animationDelay = Math.random() * 3 + 's';
            heart.style.animationDuration = (Math.random() * 3 + 4) + 's';
            
            const colors = ['#ff0844', '#FF1493', '#DC143C', '#C71585'];
            heart.style.background = colors[Math.floor(Math.random() * colors.length)];
            
            const beforeAfter = document.createElement('style');
            beforeAfter.textContent = `
                .heart:nth-child(${document.querySelectorAll('.heart').length + 1}):before,
                .heart:nth-child(${document.querySelectorAll('.heart').length + 1}):after {
                    background: ${heart.style.background};
                }
            `;
            document.head.appendChild(beforeAfter);
            
            document.body.appendChild(heart);
        }

        for(let i = 0; i < 20; i++) {
            createHeart();
        }
    </script>
</body>
</html>
